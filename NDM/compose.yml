services:
  backend:
    container_name: backend
    build: .
    image: backend:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - project-network
  nginx-1:
    container_name: nginx-1
    image: nginx:1.31.0
    restart: unless-stopped
    environment:
      - NEXT_STEP=nginx-2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 8081:80
    networks:
      - project-network
  nginx-2:
    container_name: nginx-2
    image: nginx:1.31.0
    restart: unless-stopped
    environment:
      - NEXT_STEP=nginx-3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 8082:80
    networks:
      - project-network
  nginx-3:
    container_name: nginx-3
    image: nginx:1.31.0
    restart: unless-stopped
    environment:
      - NEXT_STEP=backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro 
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 8083:80
    networks:
      - project-network      
networks:
  project-network:
    name: project-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
